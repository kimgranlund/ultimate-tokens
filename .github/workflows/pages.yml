name: Deploy demo to GitHub Pages (manual)

# Publishes the dependency-free single-file build (dist/ultimate-tokens.html)
# as the site root, so the public repo has a one-click live demo.
#
# MANUAL FALLBACK ONLY (#489) — the push-to-main trigger retired in favor of ci.yml's own `deploy`
# job, which reuses the SAME dist/ build ci.yml already produced and fully validated (npm test +
# the generated-artifacts drift gate + real-browser smoke), instead of a second, untested build here.
# Kept as workflow_dispatch for an out-of-band re-deploy (e.g. a Pages-only incident) without needing
# a new commit. Shares the SAME `pages` concurrency group as ci.yml's deploy job (concurrency groups
# are repo-wide, not per-workflow), so a manual run here still correctly queues behind — never races
# — an automatic deploy in flight.

on:
  workflow_dispatch:

# Grant the GITHUB_TOKEN the scopes the Pages deploy needs (and nothing more).
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; let an in-flight deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      # The offline single-file build IS the demo — copy it to the site root as index.html.
      # It has no external assets, so no base-path juggling is needed under the project subpath.
      # The brand icons + favicon files ride along so the head's absolute og:image URL (and any
      # direct /favicon/ request) resolves on the deployed origin; the page itself never loads them.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp dist/ultimate-tokens.html _site/index.html
          cp -R dist/icons _site/icons
          cp -R dist/favicon _site/favicon
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
