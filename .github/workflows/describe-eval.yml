name: Describe-palette golden eval

# Scheduled + manual only — deliberately NOT on push/pull_request. This calls a real provider model
# (LLM cost + nondeterminism, #375's own acceptance: "LLM cost/flake makes per-PR gating optional") to
# catch rubric regressions in mcp/describe-rubric.mjs's teaching, not to gate a merge.
on:
  workflow_dispatch: {}
  schedule:
    # weekly — frequent enough to catch a rubric/exemplar regression before it's stale, infrequent enough
    # to keep provider cost negligible for a 15-entry eval set.
    - cron: "0 6 * * 1"

jobs:
  describe-eval:
    runs-on: ubuntu-latest
    # CI secret custody (#375's own stated open item; R8): the eval key must be added as a
    # repository secret before the eval can run at all. It is scoped to the two steps that need it,
    # at step level (GitHub allows the `secrets` context in step `env:`, only not in a step `if:`);
    # the shell test below is what fails loudly on an empty value, rather than letting
    # describe-eval-runner.mjs's own no-key path report a quiet success. A badge that can't lie is the point.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Require the eval key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set: add it as a repository secret (gh secret set ANTHROPIC_API_KEY) before this eval can run" >&2
            exit 1
          fi
      - name: Run the golden-description eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node mcp/describe-eval-runner.mjs
