name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per (workflow, ref) — a PR ref (refs/pull/<n>/merge) is stable across pushes to
# that PR, so a new push cancels the PR's own prior run; cancel-in-progress is FALSE for anything
# that isn't a pull_request (a main push), so main runs are never cancelled — they queue instead
# (main's own ref is shared across pushes too, so a rare back-to-back push to main runs sequentially,
# never in parallel, never cancelled — the safer default for a ref that also triggers the Pages
# deploy below). #489.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # the browser smoke uses node's global WebSocket (stable since 22)
      # npm ci, not install: the committed lockfile IS the toolchain that produces the committed
      # generated artifacts — reproducibility of that chain is the point (TKT-0011).
      - run: npm ci
      - run: npm run build
      - run: npm test
      # GENERATED-ARTIFACT DRIFT GATE (TKT-0011): build+test regenerate the committed artifacts
      # (figma/plugin/ui.html, src/ui/*-assets.js, src/ui/categories/*, docs/img) in this runner —
      # if the regenerated bytes differ from what was COMMITTED, the contributor skipped the gen
      # scripts and every real consumer (Figma plugin, npm channel, zip) would ship stale output on
      # a green build. Fail loudly instead.
      - name: Generated artifacts match committed
        run: |
          git diff --exit-code || { echo "::error::Committed generated artifacts are stale — run npm test locally and commit the regenerated files."; exit 1; }
      # real-browser smoke: boot the built single-file in the runner's headless Chrome (CDP, no extra
      # deps) and drive gallery → category → editor → export dialog. Catches UI regressions the DOM shim can't.
      - run: npm run smoke
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: smoke-out/
          if-no-files-found: ignore
      # ── Pages site (#489 — folded in from the retired push trigger of pages.yml, which stays as a
      # workflow_dispatch-only manual fallback) — assembled from the SAME dist/ this job already built
      # + fully validated (npm test + the drift gate + real-browser smoke all passed above), not a
      # second, untested build. Gated to a main push so a PR run never prepares (or wastes time on) a
      # deploy artifact nothing will consume — the `deploy` job below only runs on that same condition.
      - name: Assemble Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp dist/ultimate-tokens.html _site/index.html
          cp -R dist/icons _site/icons
          cp -R dist/favicon _site/favicon
      - uses: actions/configure-pages@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: _site

  # ── Panda/Radix codegen smoke (K5, #590, docs/spec/spec-panda-park-ui-exports.md REQ-072) ──
  # A REAL `panda cssgen`/`codegen` run over both preset modules via `npx` — the one leg in this
  # repo that legitimately needs registry access. Independent of build-test (own runner, no
  # `needs:`) so it never blocks `deploy`; same trigger as the rest of this workflow's `on:`
  # block (H-4: script + CI job, never inside `npm test`, which stays zero-dependency). No
  # `npm ci` needed — the script imports only this repo's own engine/UI ESM modules, no npm
  # package of its own; `npx --yes` fetches `@pandacss/dev` straight from the registry at run time.
  panda-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/smoke-panda.mjs

  # ── FULL curated-corpus contrast sweep (#674, test/engine/curated-contrast.mjs --full) ──
  # `npm test` runs the same gate SAMPLED (brands.json in full + one deterministic volume per gallery
  # category) so the suite stays fast; the full sweep — 343 documents x 3 tone modes = 22680
  # accent/on-color cells — runs here instead. It measured 17-27 s on a dev host, but that is
  # host-sensitive (mirror parsing dominates, not the derivation); this job's own time is the one to
  # read. Own runner, no `needs:` — it is a data gate
  # over committed generated mirrors (src/ui/categories/*.js), so it never blocks `deploy` and needs
  # no `npm ci`: zero dependencies,
  # this repo's own ESM only. The build-test job's drift gate is what proves those mirrors are current.
  corpus-contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run gate:corpus-contrast

  # FULL sweeps matrix (#713): one runner per heavy gate script, each running the full-corpus
  # sweep U1 registered, on every PR. Own runners, fail-fast false so one red leg never hides
  # another, no needs: and no npm ci for the same zero-dependency reasoning as corpus-contrast
  # above, and no if: or continue-on-error: on any leg, so a red leg reds this job's own
  # conclusion and nothing here can mask it.
  sweeps:
    strategy:
      fail-fast: false
      matrix:
        gate:
          - gate:corpus-tonal
          - gate:corpus-anchor
          - gate:sweep-prime
          - gate:corpus-reset
          - gate:corpus-contrast
          - gate:mode-isolation
          - gate:even-dips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run ${{ matrix.gate }}

  # ── Pages deploy (#489) — push-to-main only, consumes the artifact build-test already uploaded
  # above (no rebuild). A separate JOB-LEVEL concurrency group (not the workflow-level one above,
  # which is keyed per-ref and would let two main pushes' deploys race) — preserves pages.yml's own
  # "one publish at a time, let an in-flight deploy finish" contract verbatim: cancel-in-progress
  # false, so a second deploy queues behind the first rather than cancelling or racing it. Permissions
  # mirror pages.yml exactly (this job, not build-test, is the one actually calling the Pages API).
  deploy:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
